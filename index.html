<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px}

@media(min-width:800px){#side{display:block;position:fixed;left:0;top:0;bottom:0;width:220px;padding:24px 14px;border-right:1px solid var(--bd);background:var(--card)}#bot{display:none}#main{margin-left:220px;max-width:none;padding:32px 40px}#main>*{max-width:740px}.ov{align-items:center}.sh{border-radius:20px}
#side h3{margin:0 0 20px 10px;color:var(--ac)}#side small{display:block;margin:16px 10px 4px;color:var(--mu);font-size:11px;letter-spacing:.08em}#side button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:10px;font-size:15px}#side .on{background:var(--acs);color:var(--ac)}}
</style></head><body>
<nav id="side"></nav><main id="main"></main><nav id="bot"></nav><div id="ovh"></div>
<script>

const Store={load(){try{return JSON.parse(localStorage.getItem('lifehub')||'{}')}catch(e){return{}}},save(d){try{localStorage.setItem('lifehub',JSON.stringify(d))}catch(e){}}};
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>ymd(new Date()),P=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)},addD=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return ymd(d)},wk=s=>addD(s,-P(s).getDay()),uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fmt=s=>P(s).toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'});
const D={events:[],assign:[],money:{},tasks:[],dumps:[],checkins:{},study:[],work:[],weights:[],water:[],coop:[],habits:{},laundry:[],chores:[],set:{name:'Evva',study:30,tread:5,arm:3,self:5,coop:20,water:2000,theme:'',courses:''}};
let S=Object.assign({},D,Store.load());S.set=Object.assign({},D.set,S.set);let dref,tm;

async function cloud(){try{if(!window.claude)return;const u=await claude.use('user'),d=await claude.use('db');if(!u||!d)return;const id=await u.id();dref=d.collection('data/users/'+id).doc('lifehub');const sn=await dref.get();if(sn.exists){const rm=JSON.parse(sn.data().json);if((rm.ts||0)>(S.ts||0)){S=Object.assign({},D,rm);S.set=Object.assign({},D.set,S.set);Store.save(S);R();return}}save();R()}catch(e){}}
const CATS=['School','Work','Softball','Home','Personal','Health','Other'],EM={School:'🎓',Work:'💼',Softball:'🥎',Home:'🏠',Personal:'✨',Health:'🏃',Other:'•'};
let page='home',tab='today',ct='school',wr='30',cv='week',cd=today();
const NAV=[['home','🏠','Dashboard','Home'],['tasks','✅','Tasks','Tasks'],['cal','📅','Calendar','Calendar'],['checkin','🌙','Nightly Check-In','Check-In'],['health','🏃','Health','Health'],['coop','🎓','School & Co-op','School'],['chores','🧹','Chores','Chores'],['money','💰','Money','Money']];
const H=d=>S.habits[d]||(S.habits[d]={});
const sum=(a,d)=>a.filter(x=>x.date==d).reduce((n,x)=>n+(+x.min||+x.ml||0),0);
const weekOf=d=>{const w=wk(d);return[w,addD(w,6)]};const inWk=(x,w)=>x.date>=w&&x.date<=addD(w,6);

m.innerHTML=`<div class=sh><h2>${title}</h2>${f.map(x=>`<label>${x.l}${x.t=='select'?`<select name=${x.k}>${x.o.map(o=>`<option ${o==x.v?'selected':''}>${o}</option>`).join('')}</select>`:x.t=='area'?`<textarea name=${x.k}>${esc(x.v)}</textarea>`:`<input name=${x.k} type=${x.t||'text'} value="${esc(x.v)}" ${x.t=='number'?'step=any inputmode=decimal':''}>`}</label>`).join('')}<div class=row><button class=b1>Save</button>${del?'<button class=bd>Delete</button>':''}<button class=b2>Cancel</button></div></div>`;
const c=()=>m.remove();m.onclick=e=>{if(e.target==m)c()};const bs=m.querySelectorAll('button');bs[0].onclick=()=>{const v={};f.forEach(x=>v[x.k]=m.querySelector(`[name=${x.k}]`).value.trim());if(f[0].req&&!v[f[0].k])return m.querySelector('input,textarea').focus();c();ok(v)};
if(del){bs[1].onclick=()=>{c();del()};bs[2].onclick=c}else bs[1].onclick=c;$('#ovh').append(m);const i=m.querySelector('input,textarea');if(i&&i.type=='text')i.focus()}
const upd=()=>{save();R()};
function taskF(t={}){return[{k:'name',l:'Task',v:t.name||'',req:1},{k:'date',l:'Date',t:'date',v:t.date||today()},{k:'cat',l:'Category',t:'select',o:CATS,v:t.cat||'Personal'},{k:'pri',l:'Priority',t:'select',o:['Low','Normal','High'],v:t.pri||'Normal'},{k:'time',l:'Time (optional)',t:'time',v:t.time||''},{k:'notes',l:'Notes',t:'area',v:t.notes||''}]}

const srt=(a,b)=>a.done-b.done||(a.time||'99').localeCompare(b.time||'99');

const V={
home(){const d=today(),h=new Date().getHours(),g=h<5?'Good night':h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Good night',ts=tOn(d),dn=ts.filter(t=>t.done).length,st=sum(S.study,d),hb=H(d),wo=S.work.some(x=>x.date==d&&x.kind=='tread')||hb.workout=='done',up=S.tasks.filter(t=>!t.done&&t.date>d&&t.date<=addD(d,7)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5),pr=(S.checkins[addD(d,-1)]||{}).prios||[];
return`<div class=hd style="align-items:flex-start"><h1>${g}, ${esc(S.set.name)}</h1><button class=gear data-a=go data-i=settings aria-label=Settings>⚙️</button></div><p class=sub>${P(d).toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'})} · Here's what's on your plate today.</p>
<div class=stats><div class=stat><b>${dn} / ${ts.length}</b><span>Tasks</span></div><div class=stat><b>${st} min</b><span>Study</span></div><div class=stat><b>${wo?'✓ Done':'Not yet'}</b><span>Workout</span></div><div class=stat><b>${coopN(wk(d))} / ${S.set.coop}</b><span>Co-op</span></div></div>
${pr.filter(Boolean).length?`<div class=card><h2>Today's priorities</h2>${pr.filter(Boolean).map((p,i)=>`<div class=tk>${i+1}. ${esc(p)}</div>`).join('')}</div>`:''}
${items(d).some(x=>x.k=='ev')?`<div class=card><h2 style="margin-bottom:6px">Today's Schedule</h2>${items(d).filter(x=>x.k=='ev').map(crow).join('')}</div>`:''}<div class=card><div class=hd><h2>Today's Tasks</h2><button class=chip data-a=add>+ Add Task</button></div>${ts.length?ts.map(t=>row(t)).join(''):'<p class=mu>Nothing planned for today.</p>'}</div>
<div class=card><h2 style="margin-bottom:10px">Quick Actions</h2><button class=chip data-a=add>+ Task</button><button class=chip data-a=dump>🧠 Brain Dump</button><button class=chip data-a=coop>+ Co-op Application</button><button class=chip data-a=weight>+ Weight</button><button class=chip data-a=water data-i=250>+ Water</button></div>
<div class=card><h2 style="margin-bottom:10px">Your Hub</h2><div class=tiles>${[['health','🏃','Health'],['coop','🎓','School & Co-op'],['chores','🧹','Chores'],['money','💰','Money']].map(n=>`<button class=tile data-a=go data-i=${n[0]}><span>${n[1]}</span>${n[2]}</button>`).join('')}</div></div>
<div class=card><h2 style="margin-bottom:6px">Today's Habits</h2><div class=tk><div class=tb>Study<small>${st} / ${S.set.study} min${st>=S.set.study?' ✓':''}</small></div></div><div class="tk ${hb.skin?'dn':''}"><button class=ck data-a=hab data-i=skin>${hb.skin?'✓':''}</button><div class=tb>Skincare</div></div><div class="tk ${hb.self?'dn':''}"><button class=ck data-a=hab data-i=self>${hb.self?'✓':''}</button><div class=tb>Self-care</div></div><div class=tk><div class=tb>Treadmill<small>${wo?'Completed':'Still available'}</small></div></div></div>
<div class=card><h2 style="margin-bottom:6px">Coming Up</h2>${up.length?up.map(t=>row(t,1)).join(''):'<p class=mu>Nothing in the next 7 days.</p>'}<div class=row><button class=b2 data-a="go" data-i=tasks>View all</button></div></div>
${coopCard()}
<div class=card>${(S.checkins[d]||{}).done?'<b>✓ Check-In Complete</b>':`<h2>🌙 Nightly Check-In</h2><p class=mu>Ready to wrap up your day? Review today and plan tomorrow.</p><button class=b1 data-a=go data-i=checkin>Start Check-In →</button>`}</div>`},

let b;if(tab=='dump')b=`<h2>Brain Dump</h2><p class=sub>Get it out of your head. Organize it later.</p><textarea id=dt placeholder="Anything on your mind…"></textarea><div class=row><button class=b1 data-a=addDump>Add</button></div>${S.dumps.slice().reverse().map(x=>`<div class=card><div>${esc(x.text)}</div><small class=mu>${fmt(x.date)}</small><div class=row><button class=chip data-a=conv data-i=${x.id}>Convert to task</button><button class=bd data-a=delDump data-i=${x.id}>Delete</button></div></div>`).join('')}`;

checkin(){const d=today(),tm=addD(d,1),hb=H(d),c=S.checkins[d]||{},ts=tOn(d),done=ts.filter(t=>t.done).length,st=sum(S.study,d),pr=c.prios||[],woS=['Completed','Rest day','Long work shift','Not completed'];
return`<h1>Nightly Check-In</h1><p class=sub>${P(d).toLocaleDateString('en-CA',{month:'long',day:'numeric'})}</p><div class=card><h2>How did today go?</h2><div class=tk><div class=tb>Study<small>${st} min${st>=S.set.study?' ✓':''}</small></div></div><div class="tk ${hb.skin?'dn':''}"><button class=ck data-a=hab data-i=skin>${hb.skin?'✓':''}</button><div class=tb>Skincare</div></div><div class="tk ${hb.self?'dn':''}"><button class=ck data-a=hab data-i=self>${hb.self?'✓':''}</button><div class=tb>Self-care</div></div>
<label>Workout<select id=wo data-a=wo>${['—',...woS].map(o=>`<option ${(hb.workoutLabel||'—')==o?'selected':''}>${o}</option>`).join('')}</select></label><div class=tk><div class=tb>Tasks<small>${done} completed · ${ts.length-done} remaining</small></div></div>${ts.filter(t=>!t.done).map(t=>row(t)).join('')}
<label>One thing that went well<textarea id=cw>${esc(c.well)}</textarea></label><label>One thing to carry into tomorrow<textarea id=cc>${esc(c.carry)}</textarea></label></div>
<div class=card><div class=hd><h2>Tomorrow</h2><button class=chip data-a=addTm>+ Add Task</button></div>${tOn(tm).map(t=>row(t)).join('')||'<p class=mu>No tasks yet.</p>'}<label>Priority 1<input id=p0 value="${esc(pr[0])}"></label><label>Priority 2<input id=p1 value="${esc(pr[1])}"></label><label>Priority 3<input id=p2 value="${esc(pr[2])}"></label></div>
<button class=b1 style="width:100%" data-a=finish>Complete Check-In</button>${c.done?'<p class=sub>✓ Day wrapped up. Tomorrow is ready.</p>':''}`},
health(){const d=today(),w=wk(d),wkW=S.work.filter(x=>inWk(x,w)),tr=new Set(wkW.filter(x=>x.kind=='tread'&&x.min>=30).map(x=>x.date)).size,ar=wkW.filter(x=>x.kind=='arm').length,sw=S.study.filter(x=>inWk(x,w)).reduce((n,x)=>n+ +x.min,0),wt=S.weights.slice().sort((a,b)=>a.date.localeCompare(b.date)),lw=wt[wt.length-1],wa=sum(S.water,d),sc=Object.entries(S.habits).filter(([k,v])=>inWk({date:k},w)&&v.self).length;
return`<h1>Health</h1><p class=sub></p><div class=card><h2>Activity</h2><p>Treadmill <b>${tr} / ${S.set.tread}</b> days</p>${bar(tr,S.set.tread)}<button class=chip data-a=work>+ Log Workout</button><p>Arm workouts <b>${ar} / ${S.set.arm}</b></p>${bar(ar,S.set.arm)}<button class=chip data-a=arm>+ Log Arm Workout</button></div>
<div class=card><h2>Study</h2><p>Today <b>${sum(S.study,d)} min</b> · This week <b>${Math.floor(sw/60)} hr ${sw%60} min</b></p><button class=chip data-a=study>+ Log Study</button></div>

<div class=card><h2>Water</h2><p><b>${wa.toLocaleString()} mL</b> / ${S.set.water.toLocaleString()} mL</p>${bar(wa,S.set.water)}${[250,500,750].map(n=>`<button class=chip data-a=water data-i=${n}>+${n} mL</button>`).join('')}<button class=chip data-a=waterC>Custom</button></div>
